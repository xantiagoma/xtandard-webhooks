name: Release

# Publishes to npm when a version tag is pushed (e.g. v0.1.0).
#
# Release flow (manual, proven in the flags repo): bump version with `npm pkg
# set version=X`, prepend the CHANGELOG entry, commit `chore(release): vX`,
# tag `vX`, push main FIRST and the tag second — the tag push triggers this
# workflow.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. The trust is
# configured on npmjs.com for this repo + this workflow file
# (`npm trust github @xtandard/webhooks --repo xantiagoma/xtandard-webhooks --file release.yml`),
# and needs npm >= 11.5.1 (Node 24 ships it).
#
# Re-publish an existing tag (e.g. after a failed publish): run this workflow
# manually with `tag` set — `gh workflow run release.yml -f tag=v0.1.3`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.3)"
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package
        run: bunx publint

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public

      # Turn the pushed tag into a GitHub Release (shown on /releases). Notes are
      # the tag's CHANGELOG.md section — `--generate-notes` only lists merged PRs,
      # and releases here are direct pushes, so it would be just a compare link.
      - name: Create or publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v h="## ${TAG}" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "${PREV}" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${PREV}" "${TAG}" >> notes.md
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — publishing it."
            gh release edit "${TAG}" --draft=false --latest --notes-file notes.md
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file notes.md \
              --verify-tag \
              --latest
          fi
