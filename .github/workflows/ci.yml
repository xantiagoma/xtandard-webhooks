name: CI

# The family CI (typecheck incl. examples, lint, fmt, coverage against live
# redis:8 / mongo / postgres / mysql, test:bun, build, publint, pack dry-run, and
# the browser e2e) is the kit's reusable workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: xantiagoma/xtandard-kit/.github/workflows/ci.yml@v0.1
    with:
      db-name: webhooks
      typecheck-examples: true
      e2e: true
