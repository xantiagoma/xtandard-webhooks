name: Pages

# Builds the documentation site (site/: Astro Starlight over README.md + docs/*.md, plus a TypeDoc
# API reference generated from src/) and publishes it to GitHub Pages:
#
#   https://me.xantiagoma.com/xtandard-webhooks/   (the account's Pages domain; also xantiagoma.github.io/xtandard-webhooks/)
#
# Local: `bun run docs:dev`, or `bun run docs:build && bun run docs:preview`.
# Pull requests that touch the docs build and check them (broken links fail) without deploying.
# Prerequisite (owner, once): Settings → Pages → Source: "GitHub Actions".
# The build and deploy steps are the kit's reusable pages.yml.

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "site/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled; a pull request's newer build cancels its older one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: xantiagoma/xtandard-kit/.github/workflows/pages.yml@v0.1
    permissions:
      contents: read
      pages: write
      id-token: write
