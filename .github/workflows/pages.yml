name: Pages

# Builds the documentation site (site/: Astro Starlight over README.md + docs/*.md, plus a TypeDoc
# API reference generated from src/) and publishes it to GitHub Pages:
#
#   https://me.xantiagoma.com/xtandard-webhooks/   (the account's Pages domain; also xantiagoma.github.io/xtandard-webhooks/)
#
# Local: `bun run docs:dev`, or `bun run docs:build && bun run docs:preview`.
# Pull requests that touch the docs build and check them (broken links fail) without deploying.
# Prerequisite (owner, once): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "site/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled; a pull request's newer build cancels its older one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Pages origin and base path
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      # The root install provides the library's dependencies and peers (types for the API
      # reference); the site has its own lockfile.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - name: Build the site (fails on a broken link)
        working-directory: site
        env:
          # Empty on pull requests: the defaults in site/manifest.ts apply.
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
